# ========================================
# Mini V36 Joystick — User configuration
# Board:  nice_nano_v2 (nRF52840, single unibody keyboard)
# Layout: 36-key unibody (5×3 + 3 thumb per side), ±7° rotation
# Pointing: analog joystick OR 5-way tactile switch
# ========================================

### Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

### Pointing device subsystem (required)
CONFIG_ZMK_POINTING=y

### Select joystick type — uncomment exactly one:
# CONFIG_MINI_V36_JOYSTICK_TYPE_ANALOG=y
CONFIG_MINI_V36_JOYSTICK_TYPE_5WAY=y

### OLED Display
# NOTE: incompatible with 5-way switch (pins 18/19 shared with I2C).
# Only enable when CONFIG_MINI_V36_JOYSTICK_TYPE_ANALOG=y.
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

### ZMK Studio (live keymap editing)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### Debounce tuning
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### HID compatibility
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

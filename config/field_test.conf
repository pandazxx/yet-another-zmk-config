# ========================================
# Field Test — User configuration
# Board:   nice_nano_v2 (nRF52840, unibody)
# Layout:  4-key test keyboard
# Pointing: analog joystick (ADC X/Y + button)
# ========================================

### Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

### Power management
CONFIG_ZMK_SLEEP=y

### Pointing device subsystem (required)
CONFIG_ZMK_POINTING=y

### Analog joystick driver dependencies
CONFIG_ADC=y

### ZMK Studio (live keymap editing)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### Debounce tuning
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_BT_DEVICE_NAME="testfield"
CONFIG_FIELD_TEST_ANALOG=y

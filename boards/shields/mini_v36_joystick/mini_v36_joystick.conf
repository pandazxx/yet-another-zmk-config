# Mini V36 Joystick — Base shield configuration

# Pointing device subsystem (required for both joystick types)
CONFIG_ZMK_POINTING=y

# Select pointing device type (also set in config/mini_v36_joystick.conf):
# CONFIG_MINI_V36_JOYSTICK_TYPE_ANALOG=y
# CONFIG_MINI_V36_JOYSTICK_TYPE_5WAY=y

# Uncomment to enable OLED display (incompatible with 5-way switch):
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

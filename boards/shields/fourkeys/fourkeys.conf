# ============================================================
# 4keys joystick shield — base configuration
# ============================================================

# ZMK pointing device — required to expose HID mouse over USB/BLE
CONFIG_ZMK_POINTING=y

# Analog input driver (required for joystick-as-mouse)
CONFIG_ADC=y
CONFIG_ANALOG_INPUT=y
CONFIG_INPUT=y

# Debug logging — enabled temporarily to diagnose joystick issue
# 1. Connect the board via USB
# 2. Run: ls /dev/tty.usbmodem* — note ALL ports listed
# 3. Connect to each: screen /dev/tty.usbmodem<N> 115200
# 4. Move the joystick and look for "AIN raw:" lines
CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y
CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
